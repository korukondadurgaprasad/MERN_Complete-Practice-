<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .subscribe {
            background-color: rgb(203, 24, 24);
            color: white;
            border: none;
            height: 30px;
            width: 100px;
            border-radius: 2px;
            cursor: pointer;
        }
        .subscribe:hover {
            background-color: rgb(255, 0, 0);
            opacity: 0.8;
        }
        .join {
            background-color: white;
            border-color: rgb(0, 157, 255);
            border-style: solid;
            border-width: 1px;
            color: rgb(0, 157, 255);
            height: 30px;
            width: 90px;
            border-radius: 2px;
            cursor: pointer;
        }
        .join:hover {
            background-color: rgb(0, 157, 255);
            color: white;
        }
        .tweet {
            background-color: rgb(29, 161, 242);
            color: white;
            border: none;
            height: 30px;
            width: 80px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .tweet:hover {
            background-color: rgb(26, 145, 218);
            opacity: 0.8;
            box-shadow: 1px 1px 2px rgba(5, 1, 1, 0.951);
    
        }

    </style>



    <button class="subscribe">
        SUBSCRIBE
    </button>


    <button class="join">
        JOIN US
    </button>

    <button class="tweet" >
        Tweet
    </button>
    
</body>
</html>
